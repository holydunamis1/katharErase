# l10n.yaml
#
# CORRECTED against real CI output (flutter pub get / gen-l10n run on
# Flutter 3.44.7), not just doc research — two things changed from the
# original version of this file:
#
# 1. `synthetic-package` removed. It's now a no-op on this exact Flutter
#    version — CI logged "The argument 'synthetic-package' no longer has
#    any effect and should be removed." The breaking-changes doc I
#    checked when writing this file (dated 2026-05-05) described an
#    interim state where the flag was becoming required; by the time
#    3.44.7 actually shipped, it went further and was fully deprecated,
#    with output-dir alone now sufficient to signal non-synthetic mode.
#    This is exactly why a real CI run matters more than doc research
#    alone — the live output is ground truth, doc research got the
#    direction right but not the exact landing point.
#
# 2. `required-resource-attributes` removed. This was the actual fatal
#    error: "Resource attribute '@onboardingPage1Title' was not found."
#    That flag requires every single ARB key to have a matching `@key`
#    metadata block — almost none of app_en.arb's ~90 keys have one
#    (only the ones with placeholders, like exportQualityLabel, do).
#    Adding ~90 empty `@key: {}` blocks for no functional benefit on a
#    solo project with no translation team yet isn't worth it — removing
#    the flag is the right fix, not mechanically satisfying it.

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/generated/l10n
nullable-getter: false
