// Version pins updated against Flutter's OWN explicit build-time
// warnings (not third-party docs this time) — Flutter's tooling directly
// stated minimum required versions during a real build attempt:
// Gradle >= 8.14.0, AGP >= 8.11.1, Kotlin >= 2.2.20. Using those exact
// stated minimums here, since they come from Flutter's own compatibility
// matrix rather than external research.

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
