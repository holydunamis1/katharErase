name: Verify (analyze + test)

# Fast feedback only. On pushes to verify/** branches it runs analyze + tests
# and builds NO APK. The Android compile check at the bottom runs only when
# this workflow is started manually.
# Full analyzer and test output is written into annotations so it can be
# read without downloading logs.
on:
  push:
    branches: ['verify/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'

      - name: Model file fingerprint
        working-directory: app
        run: |
          H=$(sha256sum assets/models/segmentation.tflite | cut -c1-16)
          S=$(stat -c %s assets/models/segmentation.tflite)
          echo "::notice title=model::segmentation.tflite size=$S sha256=$H"

      - name: Install dependencies
        working-directory: app
        run: |
          flutter pub get > /tmp/pubget.txt 2>&1
          code=$?
          cat /tmp/pubget.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 20000 /tmp/pubget.txt | python3 -c "import sys; t=sys.stdin.read(); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),end='')")
            echo "::error title=pub get FAILED::$msg"
            exit 1
          fi

      - name: Generate code
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs > /tmp/gen.txt 2>&1
          code=$?
          tail -n 30 /tmp/gen.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 20000 /tmp/gen.txt | python3 -c "import sys; t=sys.stdin.read(); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),end='')")
            echo "::error title=build_runner FAILED::$msg"
            exit 1
          fi

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze > /tmp/analyze.txt 2>&1
          code=$?
          cat /tmp/analyze.txt
          # Compact report (issue lines only) so it fits in an annotation.
          grep -E "(error|warning|info) •" /tmp/analyze.txt | cut -c1-230 | head -n 25 > /tmp/analyze_short.txt
          [ -s /tmp/analyze_short.txt ] || tail -n 5 /tmp/analyze.txt > /tmp/analyze_short.txt
          msg=$(head -c 3500 /tmp/analyze_short.txt | python3 -c "import sys; t=sys.stdin.read(); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),end='')")
          if [ $code -ne 0 ]; then
            echo "::error title=ANALYZE FAILED::$msg"
            exit 1
          fi
          echo "::notice title=ANALYZE PASSED::$msg"

      - name: Test
        if: always()
        working-directory: app
        run: |
          flutter test --reporter expanded > /tmp/test.txt 2>&1
          code=$?
          cat /tmp/test.txt
          msg=$(tail -c 3500 /tmp/test.txt | python3 -c "import sys; t=sys.stdin.read(); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),end='')")
          if [ $code -ne 0 ]; then
            echo "::error title=TESTS FAILED::$msg"
            exit 1
          fi
          echo "::notice title=TESTS PASSED::$msg"

      # --- Android compile check (debug APK), so Gradle / desugaring /
      # manifest problems are caught here rather than in the real build.
      - name: Free up disk space
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        if: github.event_name == 'workflow_dispatch'
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK (arm64)
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: |
          flutter build apk --debug --target-platform android-arm64 > /tmp/apk.txt 2>&1
          code=$?
          tail -n 40 /tmp/apk.txt
          msg=$(tail -c 40000 /tmp/apk.txt | python3 -c "import sys; t=sys.stdin.read(); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),end='')")
          if [ $code -ne 0 ]; then
            echo "::error title=APK BUILD FAILED::$msg"
            exit 1
          fi
          echo "::notice title=APK BUILD PASSED::$msg"

